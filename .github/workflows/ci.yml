name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run unit tests
        run: cargo test

      - name: Build all binaries
        run: cargo build --bins

      - name: Test server and client integration
        run: bash scripts/server-client-tests.sh

  build-check:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: ARM64 Linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Raspberry Pi ARMv7 Linux
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            cross_compiler: gcc-arm-linux-gnueabihf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.cross_compiler }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target
        run: cargo build --bins --target ${{ matrix.target }}
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
